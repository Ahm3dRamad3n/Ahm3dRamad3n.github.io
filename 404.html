<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            color: #00adb5;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #eeeeee;
        }
        /* تصميم الزرار */
        button {
            padding: 12px 25px;
            background-color: #00adb5;
            color: #121212;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: none; /* مخفي افتراضياً لحد ما نتأكد إن فيه هيستوري */
        }
        button:hover {
            background-color: #007a80;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! The page you're looking for disappeared into the void.</p>
    
    <!-- زرار الرجوع -->
    <button id="backBtn" onclick="window.history.back()">Go Back</button>

    <script>
        // فحص لو في صفحات سابقة في المتصفح عشان نرجع ليها
        // بنستخدم document.referrer للتأكد إن المستخدم جاي من لينك، 
        // أو history.length > 1 للتأكد إن المتصفح مسجل خطوات سابقة
        if (window.history.length > 1 || document.referrer !== "") {
            document.getElementById('backBtn').style.display = 'inline-block';
        }
    </script>
</body>
</html>
