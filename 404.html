<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            color: #00adb5;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #eeeeee;
        }
        a {
            padding: 12px 25px;
            background-color: #00adb5;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        a:hover {
            background-color: #007a80;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! The page you're looking for disappeared into the void.</p>
    <a href="https://ahm3dramad3n.github.io/">Return to Home</a>
</body>
</html>
